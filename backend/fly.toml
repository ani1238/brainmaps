# fly.toml — BrainMaps Go API
# Deploy: fly deploy  (from the backend/ directory)
# Secrets: fly secrets set DATABASE_URL=... GROQ_API_KEY=... GEMINI_API_KEY=... OPENAI_API_KEY=...

app = "brainmaps-api"
primary_region = "sin"   # Singapore — same region as Neon ap-southeast-1

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  ALLOWED_ORIGINS = "https://brainmaps.in,https://www.brainmaps.in,https://brainmaps-dun.vercel.app,https://brainmaps-ani1238s-projects.vercel.app,https://brainmaps-ani1238-ani1238s-projects.vercel.app"

[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = false   # stay warm — Neon wakes in ~500ms but cold Go start adds ~1s
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 200
    soft_limit = 150

[[http_service.checks]]
  grace_period  = "5s"
  interval      = "15s"
  method        = "GET"
  path          = "/health"
  timeout       = "5s"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"
